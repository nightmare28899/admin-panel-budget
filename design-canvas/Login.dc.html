<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root{--bg-0:#080b11;--bg-2:#171d26;--bg-3:#262e3a;--border:rgba(148,163,184,.18);--border-soft:rgba(148,163,184,.10);--text-1:#e8ebf1;--text-2:#b6beca;--text-3:#8f99a9;--blue:#3b82f6;--blue-text:#8fb8fb;--rose:#ef4444;--rose-dim:rgba(239,68,68,.13);--rose-text:#f28b8b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg-0);color:var(--text-1);font-family:'Geist',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-family:'Instrument Serif',Georgia,serif;font-style:italic}
.field-label{font-size:12.5px;color:var(--text-2);margin-bottom:7px;display:block}
.field-input{width:100%;background:var(--bg-3);border:1px solid var(--border-soft);border-radius:10px;padding:10px 14px;color:var(--text-1);font-size:13.5px;font-family:inherit}
</style>
</helmet>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden">
  <div style="position:absolute;inset:0;background:radial-gradient(560px 420px at 50% -8%,rgba(59,130,246,.14),transparent 70%)"></div>

  <div style="position:relative;width:400px;background:var(--bg-2);border:1px solid var(--border-soft);border-radius:20px;padding:38px 36px;box-shadow:0 24px 60px rgba(0,0,0,.35)">

    <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:26px">
      <div style="width:44px;height:44px;border-radius:13px;background:linear-gradient(155deg,#3b82f6,#2563eb);display:flex;align-items:center;justify-content:center;margin-bottom:14px">
        <span class="serif" style="font-size:24px;color:#fff">B</span>
      </div>
      <div style="font-weight:600;font-size:14px;color:var(--text-2);letter-spacing:.01em;margin-bottom:16px">Budget Panel</div>
      <h1 class="serif" style="font-size:28px;margin:0 0 6px;font-weight:400;text-align:center">Welcome back</h1>
      <p style="font-size:13.5px;color:var(--text-3);margin:0;text-align:center">Sign in to manage your budget</p>
    </div>

    <div style="display:flex;align-items:flex-start;gap:10px;background:var(--rose-dim);border:1px solid rgba(239,68,68,.28);border-radius:10px;padding:11px 13px;margin-bottom:20px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--rose-text)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
      <span style="font-size:12.5px;color:var(--rose-text);line-height:1.4">Invalid email or password. Please try again.</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--rose-text)" stroke-width="2" stroke-linecap="round" style="margin-left:auto;flex:none;opacity:.7"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </div>

    <div style="margin-bottom:16px">
      <label class="field-label">Email</label>
      <input class="field-input" value="ana.torres@mail.com" readonly>
    </div>

    <div style="margin-bottom:8px">
      <label class="field-label">Password</label>
      <div style="position:relative">
        <input class="field-input" style="padding-right:42px" type="password" value="••••••••••">
        <button style="position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:var(--text-3);display:flex;align-items:center;justify-content:center">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div style="text-align:right;margin-bottom:20px">
      <a href="#" style="font-size:12px">Forgot password?</a>
    </div>

    <button style="width:100%;padding:11px;border-radius:10px;border:none;background:linear-gradient(155deg,#3b82f6,#2f6fe0);color:#fff;font-size:13.5px;font-weight:600;font-family:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 4px 14px rgba(59,130,246,.35);cursor:pointer;margin-bottom:20px">Sign in</button>

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <div style="flex:1;height:1px;background:var(--border-soft)"></div>
      <span style="font-size:11.5px;color:var(--text-3)">or continue with</span>
      <div style="flex:1;height:1px;background:var(--border-soft)"></div>
    </div>

    <button style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text-1);font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;margin-bottom:22px">
      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.66-2.25 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.85A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.05H2.18a11 11 0 0 0 0 9.9z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1a11 11 0 0 0-9.82 6.05l3.66 2.85c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Continue with Google
    </button>

    <p style="text-align:center;font-size:12px;color:var(--text-3);margin:0">Need an account? <a href="#">Contact your administrator</a></p>
  </div>
</div>
</x-dc>
</body>
</html>
